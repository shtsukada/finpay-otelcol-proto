syntax = "proto3";

package finpay.v1;

option go_package = "github.com/shtsukada/finpay-otelcol-proto/gen/go/finpay/v1;finpayv1";

service FinpayService {
  rpc CreateTransfer(CreateTransferRequest) returns (CreateTransferResponse);
  rpc GetTransfer(GetTransferRequest) returns (GetTransferResponse);
}

message Money {
  string currency = 1; // "JPY"
  int64 amount = 2; // minor unit (JPY: yen)
}

enum TransferStatus {
  TRANSFER_STATUS_UNSPECIFIED = 0;
  TRANSFER_STATUS_ACCEPTED = 1;
  TRANSFER_STATUS_PROCESSING = 2;
  TRANSFER_STATUS_SUCCEEDED = 3;
  TRANSFER_STATUS_FAILED = 4;
}

message CreateTransferRequest {
  // Authentication and replay protection fields.
  string client_id = 1;
  string key_id = 2;
  string nonce = 3;
  int64 timestamp = 4;
  string signature = 5;

  // Transfer fields
  string client_transfer_id = 6;
  string idempotency_key = 7;
  Money amount = 8;
  string to_account = 9;
}

message CreateTransferResponse {
  string transfer_id = 1; // server-side id
  TransferStatus status = 2;
}

message GetTransferRequest {
  // Authentication and replay protection fields
  string client_id = 1;
  string key_id = 2;
  string nonce = 3;
  int64 timestamp = 4;
  string signature = 5;

  // Query fields
  string transfer_id = 6;
}

message GetTransferResponse {
  string transfer_id = 1;
  TransferStatus status = 2;
  string client_transfer_id = 3;
  Money amount = 4;
}
