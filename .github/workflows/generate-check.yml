name: generate-check
on:
  pull_request:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make generate
      - run: |
          git diff --exit-code || (echo "Generated files differ. Run: make generate" && exit 1)
      - run: go list ./...
      - run: go test ./...
